<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IOCL-SALES CALCULATOR</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }
        .nav-1{
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        nav{
            border: 2px solid black;
            background-color: rgb(232, 111, 19);
        }
        main{
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 20px;
            padding: 30px;
            border: 2px solid black;
            background-color: rgb(79, 79, 239);
        }
        .result{
            height: 50vh;
            width: 100vw;
           
            display: flex;
            gap: 10px;
            background-color:rgb(232, 111, 19);
            justify-content: center;
            align-items: center;
        }
        .calculation{
            border: 2px solid black;
           
            height: 45vh;
            width: 23vw ;
            background-color: rgb(61, 89, 245);
            text-align: center;
            color: white;
            size: 1%;
        }
        .cal-btn{
            padding: 10px;
            margin-top: 5px;
        }
        #btn-res{
            padding: 10px;
            border-radius: 5px;
            background-color: rgb(139, 139, 247);
            cursor: pointer;
        }
        #cal-total{
            height: 40px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color:rgb(232, 111, 19);
        }
        #total{
            padding: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <head>
        <nav>
            <div class="nav-1">
                <!--logo of indian oil-->
                <div class="nav-2">
                    <h3>IOCL</h3>
                    <h4>indian oil corporate limited</h4>
                </div>
                <h2>SALES CALCULATOR</h2>
            </div>
            
        </nav>
    </head>
    <main>
        
        <div class="dis-1">
            <input type="text" size="1" id="t-1" placeholder="a1">
            <select name="diseal" id="d0">

            </select>
            <input type="number" id="a1-1"> 
            -

            =

        </div>
        <div class="dis-1">
            <input type="text" size="1" id="t-2" placeholder="b1">
            <select name="diseal" id="d1">
                <option value="diseal">diseal</option>
                <option value="petrol">petrol</option>
            </select>
            <input type="number" id="b1-1"> 
            -
            <input type="number" name="" id="b1-2">
            =
            <input type="number" id="result-b1">
            
        </div>
        <div class="dis-1">
            <input type="text" size="1" id="t-3" placeholder="a2">
            <select name="diseal" id="d2">
                <option value="diseal" >petrol</option>
                <option value="petrol">diseal</option>
            </select>
            <input type="number" id="a2-1"> 
            -
            <input type="number" name="" id="a2-2">
            =
            <input type="number" id="result-a2">
            
        </div>
        <div class="dis-1">
            <input type="text" size="1" id="t-4" placeholder="b2">
            <select name="diseal" id="d3">
                <option value="diseal">petrol</option>
                <option value="petrol">diseal</option>
            </select>
            <input type="number" id="b2-1"> 
            -
            <input type="number" name="" id="b2-2">
            =
            <input type="number" id="result-b2">
            
        </div>
        <button id="btn-res">
            get results
        </button>
    </main>
    <div class="result">
        <div class="calculation" id="1">a1 <br>
            
        </div>
        <div class="calculation" id="2">b1 <br>
            
        </div>
        <div class="calculation" id="3">a2 <br>
            
        </div>
        <div class="calculation" id="4">b2 <br>
            
        </div>
        
    </div>
    <div id="cal-total">
        <button id="total">calculate</button>
    </div>
</body>
<script src="code.js"></script>
</html>
